name: Deploy to EasyWP

on:
  push:
    branches:
      - main  # Change this if your branch is named 'master'

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 Sync Files to EasyWP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: fs-alpha.easywp.com
          username: gulfino-13d6bce
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          protocol: sftp
          # We only sync the custom parts to keep it fast
          local-dir: ./
          server-dir: /wptbox/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-config.php
            .env
