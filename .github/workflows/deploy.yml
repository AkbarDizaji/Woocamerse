name: Deploy to EasyWP

on:
  push:
    branches:
      - main  # Change this if your branch is named 'master'

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 Sync Files to EasyWP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: fs-alpha.easywp.com
          username: gulfino-13d6bce
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          # The action expects 'ftp' or 'ftps'. For SFTP over port 22, 
          # we must use 'ftp' and the action will handle the secure handshake.
          protocol: ftp
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-config.php
            .env
            router.php
            gulfino-diag.php
            g-info.php
            purge-cache.php
            check-db-http.php
            check-urls.php
            gulfino-fix.php
            gulfino-check.php
            gulfino-repair.php
